spring.application.name=chatbot-backend
server.port=8081

chatbot.provider=${CHATBOT_PROVIDER:OLLAMA}
chatbot.model=${CHATBOT_MODEL:llama3.2}
chatbot.base-url=${CHATBOT_BASE_URL:http://ollama:11434}
chatbot.backend-base-url=${CHATBOT_BACKEND_BASE_URL:http://backend:8080}
chatbot.timeout-ms=${CHATBOT_TIMEOUT_MS:240000}
chatbot.max-tokens=${CHATBOT_MAX_TOKENS:1024}
chatbot.temperature=${CHATBOT_TEMPERATURE:0.2}
chatbot.context-budget-max-evidence-items=${CHATBOT_CONTEXT_BUDGET_MAX_EVIDENCE_ITEMS:20}
chatbot.context-budget-max-evidence-chars=${CHATBOT_CONTEXT_BUDGET_MAX_EVIDENCE_CHARS:12000}
chatbot.strict-evidence-only=${CHATBOT_STRICT_EVIDENCE_ONLY:true}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Pipeline intent selection (Issue #60, POST /chatbot/pipeline/intents). Q&A settings above are unaffected.
chatbot.pipeline-intent.max-tokens=${CHATBOT_PIPELINE_INTENT_MAX_TOKENS:512}
chatbot.pipeline-intent.temperature=${CHATBOT_PIPELINE_INTENT_TEMPERATURE:0.4}
chatbot.pipeline-intent.timeout-ms=${CHATBOT_PIPELINE_INTENT_TIMEOUT_MS:75000}
chatbot.pipeline-intent.context-tokens=${CHATBOT_PIPELINE_INTENT_CONTEXT_TOKENS:4096}
