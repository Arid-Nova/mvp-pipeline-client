name: Deploy MVP Pipeline Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the environment to deploy to"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
          - prod

  push:
    branches:
      - josesosa/devops/build-bicep-pipeline-with-cheaper-demo-vm

  pull_request:
    branches:
      - josesosa/devops/build-bicep-pipeline-with-cheaper-demo-vm

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
