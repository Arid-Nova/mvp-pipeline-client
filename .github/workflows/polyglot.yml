name: Polyglot pipeline
on:
  pull_request:
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  jvm-source-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/build_cimet.py
      - run: mvn -B -f backend/pom.xml verify
      - run: mvn -B -f componentanalysis/pom.xml verify
      - run: npm --prefix javascript-security ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix javascript-security test
      - run: python scripts/sync_javascript_workflow.py --check
      - run: python javascript-policy/sync.py --check
      - name: Build source-pinned runtime images
        run: docker compose --progress plain build backend components
      - name: Check unprivileged Java and Node runtimes
        run: |
          for image in aridnova-toolkit-backend aridnova-toolkit-components; do
            docker run --rm --network none --entrypoint sh "$image" -c 'test "$(id -u)" = 10001 && java -version && node --version && test -w /app && test -f /app/vendor/javascript/node_modules/typescript/lib/typescript.js'
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-polyglot-test-reports
          path: |
            backend/target/surefire-reports
            componentanalysis/target/surefire-reports

  capability-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            coordinator/package-lock.json
            javascript-security/package-lock.json
            javascript-policy/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: javascript-policy/requirements-test.txt
      # A pinned public transitive frontend dependency uses an SSH Git URL.
      - name: Fetch public frontend Git dependency through HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install bounded analyzer and authored fixture dependencies
        run: |
          npm --prefix javascript-security ci --ignore-scripts --no-audit --no-fund
          npm --prefix javascript-policy ci --ignore-scripts --no-audit --no-fund
      - name: Install lightweight service test dependencies
        run: python -m pip install --disable-pip-version-check -r javascript-policy/requirements-test.txt
      - name: Verify canonical source and policy copies
        run: |
          python scripts/sync_javascript_workflow.py --check
          python javascript-policy/sync.py --check
      - name: Test static JavaScript analyzer
        run: npm --prefix javascript-security test
      - name: Build and test coordinator capability dispatch
        working-directory: coordinator
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - name: Test finite policies and isolated synthetic HTTP fixtures
        working-directory: javascript-policy
        run: python -m unittest discover -s tests -v
      - name: Test saved-source security capability guards
        working-directory: aegis
        run: python -m unittest discover -s tests -v
      - name: Test formal-verification capability guards
        working-directory: formalmethod
        run: python -m unittest discover -s tests -v
      - name: Test authorization-vector capability guards
        working-directory: vectorgenerator
        run: python -m unittest discover -s tests -v
      - name: Test unknown-permission scenario handling
        working-directory: scenariogenerator
        run: python -m unittest discover -s tests -v
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck frontend and test graph/source-evidence compatibility
        working-directory: frontend
        run: |
          npx --no-install tsc --noEmit
          npm test -- --watchAll=false --runInBand --testMatch='**/ExpressSecurityReport.test.tsx' '**/polyglotGraph.test.ts' --testPathIgnorePatterns='node_modules'
      - name: Build production frontend
        working-directory: frontend
        # Upstream source-map, lint and bundle warnings are documented in docs/polyglot-validation.md.
        # Compilation/type errors remain fatal. Existing unrelated chatbot tests are documented separately.
        env:
          CI: 'false'
        run: npm run build
