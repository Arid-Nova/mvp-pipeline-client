name: aridnova-toolkit
version: '1.1.0'

services:
  mariadb:
    image: mariadb:latest
    container_name: cache_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: msGraph
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_network

  mongodb:
    image: mongo:latest
    container_name: cloudhub_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    networks:
      - app_network
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudhub_backend
    ports:
      - "8080:8080" 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://cache_db:3306/msGraph
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app_network
    restart: always

  chatbot:
    build:
      context: ./chatbot-backend
      dockerfile: Dockerfile
    container_name: cloudhub_chatbot
    ports:
      - "8081:8081"
    environment:
      CHATBOT_PROVIDER: OLLAMA
      CHATBOT_MODEL: llama3.2
      CHATBOT_BASE_URL: http://ollama:11434
      CHATBOT_TIMEOUT_MS: ${CHATBOT_TIMEOUT_MS:-120000}
      CHATBOT_MAX_TOKENS: ${CHATBOT_MAX_TOKENS:-1024}
      CHATBOT_TEMPERATURE: ${CHATBOT_TEMPERATURE:-0.2}
      CHATBOT_STRICT_EVIDENCE_ONLY: "false"
    networks:
      - app_network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_IR_SERVICE_URL=http://localhost:8080
        - REACT_APP_VERIFY_SERVICE_URL=http://localhost:9000
        - REACT_APP_COMPONENT_SERVICE_URL=http://localhost:8060
        - REACT_APP_VECTOR_SERVICE_URL=http://localhost:8050
        - REACT_APP_ANALYSIS_SERVICE_URL=http://localhost:8040
        - REACT_APP_TEST_SERVICE_URL=http://localhost:8030
        - REACT_APP_AEGIS_SERVICE_URL=http://localhost:8900
        - REACT_APP_REPO_SERVICE_URL=http://localhost:8020
        - REACT_APP_CHATBOT_SERVICE_URL=http://localhost:8081
        - REACT_APP_USER_SERVICE_URL=http://localhost:8100
        - REACT_APP_EXEC_SERVICE_URL=http://localhost:8010
        - REACT_APP_INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
        - REACT_APP_PUBLIC_POSTHOG_KEY=${PUBLIC_POSTHOG_KEY}
        - REACT_APP_PUBLIC_POSTHOG_HOST=${PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
    container_name: cloudhub_frontend
    ports:
      - "3000:3000"
    networks:
      - app_network
    environment:
      - NODE_ENV=production

  verifier:
    build:
      context: ./formalmethod
      dockerfile: Dockerfile
    container_name: cloudhub_formalverifier
    ports:
      - "9000:9000"
    environment:
      PYTHONUNBUFFERED: 1
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    networks:
      - app_network
    volumes:
      - verifier_cache:/tmp/ms_verifier_cache

  components:
    build:
      context: ./componentanalysis
      dockerfile: Dockerfile
    container_name: cloudhub_components
    ports:
      - "8060:8060" 
    networks:
      - app_network
    restart: always

  vectorgenerator:
    build:
      context: ./vectorgenerator
      dockerfile: Dockerfile
    container_name: cloudhub_vectorgenerator
    ports:
      - "8050:8050" 
    environment:
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=aegis
      - MONGO_USER=${MONGO_ROOT_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD}
    networks:
      - app_network
    restart: always

  scenariogenerator:
    build:
      context: ./scenariogenerator
      dockerfile: Dockerfile
    container_name: cloudhub_scenariogenerator
    ports:
      - "8040:8040" 
    environment:
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=aegis
      - MONGO_USER=${MONGO_ROOT_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_TEMPERATURE=0.1
      - OPENAI_API_MODEL=gpt-4o-mini
    networks:
      - app_network
    restart: always

  testgenerator:
    build:
      context: ./testgenerator
      dockerfile: Dockerfile
    container_name: cloudhub_testgenerator
    ports:
      - "8030:8030" 
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_TEMPERATURE=0.3
      - MAX_TOKENS=10000
    networks:
      - app_network
    restart: always

  testexecutor:
    build:
      context: ./testexecutor
      dockerfile: Dockerfile
    container_name: cloudhub_testexecutor
    ports:
      - "8010:8010" 
    networks:
      - app_network
    restart: always
  
  aegis_neo4j:
    image: neo4j:5-community
    container_name: aegis_neo4j
    ports:
      - "7474:7474" 
      - "7687:7687" 
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-local_neo4j_password}
      - NEO4J_dbms_memory_pagecache_size=512M
    networks:
      - app_network
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  aegis_api:
    build:
      context: ./aegis
      dockerfile: Dockerfile
    container_name: aegis_api
    command: uvicorn service:app --host 0.0.0.0 --port 8900
    ports:
      - "8900:8900"
    environment:
      PYTHONUNBUFFERED: 1
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      IR_SERVICE_URL: http://cloudhub_backend:8080/ir/create
    depends_on:
      aegis_neo4j:
        condition: service_healthy
    networks:
      - app_network

  aegis_dashboard:
    build:
      context: ./aegis
      dockerfile: Dockerfile
    container_name: aegis_dashboard
    command: flask run --host=0.0.0.0 --port=5600
    environment:
      - FLASK_APP=frontend.py
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
    ports:
      - "5600:5600"
    depends_on:
      aegis_neo4j:
        condition: service_healthy
    networks:
      - app_network
  
  repohandler :
    build:
      context: ./repomanager
      dockerfile: Dockerfile
    container_name: cloudhub_repohandler
    ports:
      - "8020:8020" 
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_TEMPERATURE=0.1
      - MAX_TOKENS=10000
      - OPENAI_API_MODEL=gpt-4o-mini
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=aridnova_system
      - MONGO_USER=${MONGO_ROOT_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD}
      - GITHUB_API_VERSION=2026-03-10
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
    networks:
      - app_network
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: cloudhub_ollama
    profiles:
      - local-llm
    ports:
      - "11434:11434"
    networks:
      - app_network
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  usermanager :
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: cloudhub_usermanager
    ports:
      - "8100:8100" 
    environment:
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=aridnova_system
      - MONGO_USER=${MONGO_ROOT_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - LANDING_ORIGINS=${LANDING_ORIGINS:-}
    networks:
      - app_network
    restart: always

volumes:
  mariadb_data:
  verifier_cache:
  neo4j_data:
  mongo_data:
  ollama_data:

networks:
  app_network:
    driver: bridge
