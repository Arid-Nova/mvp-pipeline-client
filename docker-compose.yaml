name: cloudhub-toolkit
version: '1.1.0'

services:
  mariadb:
    image: mariadb:latest
    container_name: cache_db
    environment:
      MYSQL_ROOT_PASSWORD: csi3335rocks
      MYSQL_DATABASE: msGraph
    ports:
      - "3306:3306"
    networks:
      - app_network

  mongodb:
    image: mongo:latest
    container_name: cloudhub_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: aeGis2026Rocks
    networks:
      - app_network
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudhub_backend
    ports:
      - "8080:8080" 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://cache_db:3306/msGraph
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: csi3335rocks
    depends_on:
      - mariadb
    networks:
      - app_network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudhub_frontend
    ports:
      - "3000:3000"
    networks:
      - app_network
    environment:
      - NODE_ENV=production

  verifier:
    build:
      context: ./formalmethod
      dockerfile: Dockerfile
    container_name: cloudhub_formalverifier
    ports:
      - "9000:9000"
    networks:
      - app_network
    volumes:
      - verifier_cache:/tmp/ms_verifier_cache

  components:
    build:
      context: ./componentanalysis
      dockerfile: Dockerfile
    container_name: cloudhub_components
    ports:
      - "8060:8060" 
    networks:
      - app_network
    restart: always

  vectorgenerator:
    build:
      context: ./vectorgenerator
      dockerfile: Dockerfile
    container_name: cloudhub_vectorgenerator
    ports:
      - "8050:8050" 
    environment:
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=aegis
      - MONGO_USER=root
      - MONGO_PASSWORD=aeGis2026Rocks
    networks:
      - app_network
    restart: always

  scenariogenerator:
    build:
      context: ./scenariogenerator
      dockerfile: Dockerfile
    container_name: cloudhub_scenariogenerator
    ports:
      - "8040:8040" 
    environment:
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=aegis
      - MONGO_USER=root
      - MONGO_PASSWORD=aeGis2026Rocks
    networks:
      - app_network
    restart: always

  testgenerator:
    build:
      context: ./testgenerator
      dockerfile: Dockerfile
    container_name: cloudhub_testgenerator
    ports:
      - "8030:8030" 
    environment:
      - OPENAI_API_KEY=22hsgSpZGYB83odKbOaAtrZd82MWLOo6MSzIKypkd12Xx0yZQyMAJQQJ99BLACMsfrFXJ3w3AAAAACOGD7qp
      - OPENAI_BASE_URL=https://posturaneuroengine.cognitiveservices.azure.com/openai/v1/
      - ANTHROPIC_API_KEY=anthropic-key
      - GROQ_API_KEY=groq-key
      - LLM_TEMPERATURE=0.3
      - MAX_TOKENS=10000
    networks:
      - app_network
    restart: always
  
  aegis_neo4j:
    image: neo4j:5-community
    container_name: aegis_neo4j
    ports:
      - "7474:7474" 
      - "7687:7687" 
    environment:
      - NEO4J_AUTH=neo4j/Test1234
      - NEO4J_dbms_memory_pagecache_size=512M
    networks:
      - app_network
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  aegis_api:
    build:
      context: ./aegis
      dockerfile: Dockerfile
    container_name: aegis_api
    command: uvicorn service:app --host 0.0.0.0 --port 8900
    ports:
      - "8900:8900"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      aegis_neo4j:
        condition: service_healthy
    networks:
      - app_network

  aegis_dashboard:
    build:
      context: ./aegis
      dockerfile: Dockerfile
    container_name: aegis_dashboard
    command: flask run --host=0.0.0.0 --port=5600
    environment:
      - FLASK_APP=frontend.py
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
    ports:
      - "5600:5600"
    depends_on:
      aegis_neo4j:
        condition: service_healthy
    networks:
      - app_network

volumes:
  mariadb_data:
  verifier_cache:
  neo4j_data:
  mongo_data:

networks:
  app_network:
    driver: bridge
