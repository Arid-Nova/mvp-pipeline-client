name: aridnova-toolkit
version: '1.1.1'

services:
  mariadb:
    image: mariadb:latest
    container_name: cache_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: msGraph
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_network

  mongodb:
    image: mongo:latest
    container_name: cloudhub_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    networks:
      - app_network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudhub_backend
    ports:
      - "8080:8080" 
    environment:
      IR_RETENTION_DAYS: ${IR_RETENTION_DAYS:-1}
      SPRING_DATASOURCE_URL: ${MYSQL_URL}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_ROOT_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD}@cloudhub_mongo:27017/aridnova-core?authSource=${MONGO_AUTH_SOURCE:-admin}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      CORS_ALLOWED_ORIGINS: https://toolkit.aridnova.net,https://aridnova.net,https://www.aridnova.net,http://localhost:3000,http://localhost:8080
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  chatbot:
    build:
      context: ./chatbot-backend
      dockerfile: Dockerfile
    container_name: cloudhub_chatbot
    ports:
      - "8081:8081"
    environment:
      CHATBOT_PROVIDER: OLLAMA
      CHATBOT_MODEL: llama3.2
      CHATBOT_BASE_URL: http://ollama:11434
      CHATBOT_BACKEND_BASE_URL: http://backend:8080
      CHATBOT_TIMEOUT_MS: ${CHATBOT_TIMEOUT_MS:-240000}
      CHATBOT_MAX_TOKENS: ${CHATBOT_MAX_TOKENS:-1024}
      CHATBOT_TEMPERATURE: ${CHATBOT_TEMPERATURE:-0.2}
      CHATBOT_STRICT_EVIDENCE_ONLY: "false"
      CORS_ALLOWED_ORIGINS: https://toolkit.aridnova.net,https://aridnova.net,https://www.aridnova.net,http://localhost:3000,http://localhost:8080
    networks:
      - app_network
    # depends_on:
    #   ollama:
    #     condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: cloudhub_frontend
    ports:
      - "3000:3000"
    networks:
      - app_network
    environment:
      - NODE_ENV=development
      - REACT_APP_IR_SERVICE_URL=http://localhost:8080
      - REACT_APP_VERIFY_SERVICE_URL=http://localhost:9000
      - REACT_APP_COMPONENT_SERVICE_URL=http://localhost:8060
      - REACT_APP_VECTOR_SERVICE_URL=http://localhost:8050
      - REACT_APP_ANALYSIS_SERVICE_URL=http://localhost:8040
      - REACT_APP_TEST_SERVICE_URL=http://localhost:8030
      - REACT_APP_AEGIS_SERVICE_URL=http://localhost:8900
      - REACT_APP_REPO_SERVICE_URL=http://localhost:8020
      - REACT_APP_CHATBOT_SERVICE_URL=http://localhost:8081
      - REACT_APP_USER_SERVICE_URL=http://localhost:8100
      - REACT_APP_EXEC_SERVICE_URL=http://localhost:8010
      - REACT_APP_SLMBACKEND_SERVICE_URL=http://localhost:8071
      - REACT_APP_INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - REACT_APP_PUBLIC_POSTHOG_KEY=${PUBLIC_POSTHOG_KEY}
      - REACT_APP_PUBLIC_POSTHOG_HOST=${PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      - REACT_APP_IS_DEMO_VERSION=true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  verifier:
    build:
      context: ./formalmethod
      dockerfile: Dockerfile
    container_name: cloudhub_formalverifier
    ports:
      - "9000:9000"
    environment:
      PYTHONUNBUFFERED: 1
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    networks:
      - app_network
    volumes:
      - verifier_cache:/tmp/ms_verifier_cache
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s      
      timeout: 5s        
      retries: 3        
      start_period: 10s  

  components:
    build:
      context: ./componentanalysis
      dockerfile: Dockerfile
    container_name: cloudhub_components
    ports:
      - "8060:8060"
    environment:
      CORS_ALLOWED_ORIGINS: https://toolkit.aridnova.net,https://aridnova.net,https://www.aridnova.net,http://localhost:3000,http://localhost:8080
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD}@cloudhub_mongo:27017/aridnova-testing?authSource=${MONGO_AUTH_SOURCE:-admin}
    networks:
      - app_network
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8060/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  vectorgenerator:
    build:
      context: ./vectorgenerator
      dockerfile: Dockerfile
    container_name: cloudhub_vectorgenerator
    ports:
      - "8050:8050" 
    environment:
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=aridnova-testing
      - MONGO_USER=${MONGO_ROOT_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD}
    networks:
      - app_network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 15s      
      timeout: 5s        
      retries: 3        
      start_period: 10s  

  scenariogenerator:
    build:
      context: ./scenariogenerator
      dockerfile: Dockerfile
    container_name: cloudhub_scenariogenerator
    ports:
      - "8040:8040" 
    environment:
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=aridnova-testing
      - MONGO_USER=${MONGO_ROOT_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-1}
      - OPENAI_API_MODEL=gpt-5-mini
    networks:
      - app_network
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/health"]
      interval: 15s      
      timeout: 5s        
      retries: 3        
      start_period: 10s  

  testgenerator:
    build:
      context: ./testgenerator
      dockerfile: Dockerfile
    container_name: cloudhub_testgenerator
    ports:
      - "8030:8030" 
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # GPT-5 models only accept the default temperature (1).
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-1}
      - MAX_TOKENS=10000
    networks:
      - app_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 15s      
      timeout: 5s        
      retries: 3        
      start_period: 10s  

  testexecutor:
    build:
      context: ./testexecutor
      dockerfile: Dockerfile
    container_name: cloudhub_testexecutor
    ports:
      - "8010:8010" 
    networks:
      - app_network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 15s      
      timeout: 5s        
      retries: 3        
      start_period: 10s  
  
  aegis_neo4j:
    image: neo4j:5-community
    container_name: aegis_neo4j
    ports:
      - "7474:7474" 
      - "7687:7687" 
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-local_neo4j_password}
      - NEO4J_dbms_memory_pagecache_size=512M
    networks:
      - app_network
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  aegis_api:
    build:
      context: ./aegis
      dockerfile: Dockerfile
    container_name: aegis_api
    command: uvicorn service:app --host 0.0.0.0 --port 8900
    ports:
      - "8900:8900"
    environment:
      PYTHONUNBUFFERED: 1
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      IR_SERVICE_URL: http://cloudhub_backend:8080/ir/create
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ENDPOINT: ${OPENAI_BASE_URL}
      LLM_MODEL: gpt-5-mini
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: aridnova-aegis
      MONGO_COLLECTION_NAME: opinionVectors
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      aegis_neo4j:
        condition: service_healthy
      mongodb:        
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8900/health"]
      interval: 15s      
      timeout: 5s        
      retries: 3        
      start_period: 10s  

  aegis_dashboard:
    build:
      context: ./aegis
      dockerfile: Dockerfile
    container_name: aegis_dashboard
    command: flask run --host=0.0.0.0 --port=5600
    environment:
      FLASK_APP: frontend.py
      FLASK_DEBUG: 1
      PYTHONUNBUFFERED: 1
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: aridnova-aegis
      MONGO_COLLECTION_NAME: opinionVectors
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "5600:5600"
    depends_on:
      aegis_neo4j:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5600/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  repohandler :
    build:
      context: ./repomanager
      dockerfile: Dockerfile
    container_name: cloudhub_repohandler
    ports:
      - "8020:8020" 
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # GPT-5 models only accept the default temperature (1).
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-1}
      - MAX_TOKENS=10000
      - OPENAI_API_MODEL=gpt-5-mini
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=repo-management
      - MONGO_USER=${MONGO_ROOT_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
      - GITHUB_API_VERSION=2026-03-10
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    networks:
      - app_network
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 15s      
      timeout: 5s        
      retries: 3        
      start_period: 10s  

  ollama:
    image: ollama/ollama:latest
    container_name: cloudhub_ollama
    profiles:
      - local-llm
    ports:
      - "11434:11434"
    networks:
      - app_network
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  usermanager :
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: cloudhub_usermanager
    ports:
      - "8100:8100" 
    environment:
      - MONGO_URI=mongodb://cloudhub_mongo:27017
      - MONGO_DB=aridnova-system
      - MONGO_USER=${MONGO_ROOT_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_ROOT_PASSWORD}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      - LANDING_ORIGINS=${LANDING_ORIGINS:-}
    networks:
      - app_network
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 15s      
      timeout: 5s        
      retries: 3        
      start_period: 10s  

  slm-backend:
    build: 
      context: ./slm-backend
      dockerfile: Dockerfile
    container_name: cloudhub_slmbackend
    ports:
      - "8071:8071"
    networks:
      - app_network
    restart: always
    # depends_on:
    #   ollama:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8071/health"]
      interval: 15s      
      timeout: 5s        
      retries: 3        
      start_period: 10s  

volumes:
  mariadb_data:
  verifier_cache:
  neo4j_data:
  mongo_data:
  ollama_data:

networks:
  app_network:
    driver: bridge
