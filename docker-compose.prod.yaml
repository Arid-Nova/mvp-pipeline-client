# Production override for the Azure VM deploy. Use with:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --build
#
# Effects:
#   - Removes public port bindings from every internal service. The Docker network
#     still gives containers DNS/port access to each other by service name.
#   - Adds Caddy on :80/:443 as the only public-facing service. Caddy proxies
#     /api/<service>/* to the right backend and serves the frontend at /.
#   - Sets REACT_APP_USE_PROXY=true in the frontend's runtime config (env.sh writes
#     it to env-config.js) so its API calls are same-origin (/api/<service>/...)
#     instead of http://localhost:<port>.
#   - Keeps the MongoDB database names the live data is stored under (aegis,
#     aridnova_system). docker-compose.yaml uses newer names for local stacks;
#     switching the VM to them needs a data migration first.

services:
  frontend:
    ports: !reset []
    environment:
      # NODE_ENV stays "development" (from docker-compose.yaml): env.sh writes
      # env-config.js into the serve build folder only in that mode.
      REACT_APP_USE_PROXY: "true"

  backend:
    ports: !reset []
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD}@cloudhub_mongo:27017/aegis?authSource=${MONGO_AUTH_SOURCE:-admin}

  chatbot:
    ports: !reset []
    # The chatbot is deliberately local-only — scripts/validate-chatbot-local-only.sh
    # fails the build if its provider default moves off OLLAMA or if a cloud
    # credential appears in its path, so it must not be repointed at Azure OpenAI.
    # That makes it dependent on the ollama service, which is itself behind the
    # local-llm profile. Put chatbot in the same profile so neither starts by
    # accident in prod and leaves the UI calling a service that always fails.
    # To enable on the VM (needs CPU headroom and a model pull):
    #   docker compose --profile local-llm up -d ollama chatbot
    profiles:
      - local-llm

  verifier:
    ports: !reset []

  components:
    ports: !reset []
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD}@cloudhub_mongo:27017/aegis?authSource=${MONGO_AUTH_SOURCE:-admin}

  vectorgenerator:
    ports: !reset []
    environment:
      MONGO_DB: aegis

  scenariogenerator:
    ports: !reset []
    environment:
      MONGO_DB: aegis

  testgenerator:
    ports: !reset []

  testexecutor:
    ports: !reset []

  aegis_api:
    ports: !reset []
    environment:
      MONGO_DB_NAME: aegis

  aegis_dashboard:
    ports: !reset []
    environment:
      # Tells the Flask app it's served behind Caddy at /aegis-ui so url_for()
      # generates correctly-prefixed URLs for /static/* and redirects.
      AEGIS_URL_PREFIX: /aegis-ui
      MONGO_DB_NAME: aegis

  repohandler:
    ports: !reset []
    environment:
      MONGO_DB: aridnova_system

  usermanager:
    ports: !reset []
    environment:
      MONGO_DB: aridnova_system

  # CI/CD pipeline API (#148). Not started on the VM: exposing it publicly needs
  # DNS for api.aridnova.net, a Caddy route and an auth review first. To run it:
  #   docker compose --profile ci-api up -d coordinator
  coordinator:
    ports: !reset []
    profiles:
      - ci-api

  # Pipeline summaries (#114), reached through Caddy at /api/slm. Ollama does not
  # run on the VM, so use the Azure gpt-5-mini deployment the other services use.
  slm-backend:
    ports: !reset []
    environment:
      USE_EXTERNAL_SLM: "true"
      EXTERNAL_API_KEY: ${OPENAI_API_KEY}
      EXTERNAL_MODEL_NAME: ${OPENAI_API_MODEL:-gpt-5-mini}

  mariadb:
    ports: !reset []

  mongodb:
    ports: !reset []

  aegis_neo4j:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: cloudhub_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Set DEMO_DOMAIN in .env (e.g. aridnova-demo.eastus.cloudapp.azure.com).
      # If unset, Caddy serves over HTTP on :80 only (no auto-HTTPS).
      DEMO_DOMAIN: ${DEMO_DOMAIN:-:80}
    depends_on:
      - frontend
      - backend
    networks:
      - app_network
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
