<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aegis - System Alert</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/errorpage.css') }}">
</head>
<body>

    <div class="viz-container">
        <div class="chart-card">
            <div class="bg-pattern"></div>
            
            <div class="error-icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" class="error-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>

            <div class="error-code">{{ error_code | default('500') }} ERROR</div>
            
            <h1 class="error-title">
                {{ error_title | default('Introspection Failed') }}
            </h1>
            
            <p class="error-message">
                {{ error_message | default('The Aegis engine encountered an unexpected state while processing the risk calculus.') }}
            </p>

            <a href="/" class="back-nav-btn">
                ← Return to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
