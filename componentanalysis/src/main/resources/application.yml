spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

management:
  endpoints:
    web:
      base-path: "/"
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true